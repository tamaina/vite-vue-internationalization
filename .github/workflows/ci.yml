name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/test-types.mjs
      - run: node --expose-gc scripts/test-volar-cache-lifecycle.mjs
      - run: xvfb-run -a pnpm test:editor
      - run: pnpm package:editor
      - uses: actions/upload-artifact@v4
        with:
          name: vvi-editor-extension
          path: extensions/vscode/dist/vvi-tools.vsix
      - run: node scripts/test-ssr.mjs
      - run: node scripts/test-ssr.mjs --icu
      - run: node scripts/test-ssr.mjs --inline
      - run: node scripts/test-ssr.mjs --icu --inline
      - run: node scripts/test-inline-hash.mjs
      - run: node scripts/test-source-maps.mjs
      - run: node scripts/test-source-maps.mjs --minify
      - run: node scripts/test-source-maps.mjs --inline-map
      - run: node scripts/test-source-maps.mjs --hidden
      - run: node scripts/test-ssr.mjs --icu --inline --relative
      - run: node scripts/test-hmr.mjs
      - run: node scripts/test-hmr.mjs --inline
      - run: node scripts/test-hmr.mjs --all
      - run: node scripts/test-hmr.mjs --inline --all
